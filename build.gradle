plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tech.fastsence.common'
    compileSdk 34
    ndkVersion = "25.1.8937393"

    defaultConfig {
        minSdk 29
        targetSdk 34
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Wpedantic -O3' //-Wfatal-errors
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        prefab true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'

    api "com.opentok.android:opentok-android-sdk:${extOpentokSdkVersion}"

    api 'io.insert-koin:koin-android:3.3.3'

    api 'com.android.volley:volley:1.2.1'

    api platform('com.google.firebase:firebase-bom:30.4.1')
    api 'com.google.firebase:firebase-database-ktx:20.1.0'
    api 'com.google.firebase:firebase-storage:20.1.0'

    api platform('com.google.firebase:firebase-bom:30.5.0')
    api 'com.google.firebase:firebase-auth-ktx'
    api 'com.google.firebase:firebase-firestore-ktx'
    api 'com.firebaseui:firebase-ui-auth:7.2.0'
    api 'com.google.firebase:firebase-functions-ktx'

    api 'com.google.code.gson:gson:2.9.1'

    api 'com.google.oboe:oboe:1.8.1'

    compileOnly files('./libs/framework-tethering.jar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
