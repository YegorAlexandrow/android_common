plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tech.fastsense.common'
    compileSdk 35
    ndkVersion = "25.1.8937393"

    defaultConfig {
        minSdk 29
        targetSdk 35
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Wpedantic -O3' //-Wfatal-errors
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        prefab true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    api 'io.insert-koin:koin-android:4.0.2'

    api 'com.android.volley:volley:1.2.1'
    api 'com.opentok.android:opentok-android-sdk:2.28.4'

    api platform('com.google.firebase:firebase-bom:30.5.0')  // DO NOT UPDATE
    api 'com.google.firebase:firebase-storage-ktx'
    api 'com.google.firebase:firebase-auth-ktx'
    api 'com.google.firebase:firebase-database-ktx'
    api 'com.google.firebase:firebase-firestore-ktx'
    api 'com.google.firebase:firebase-functions-ktx'

    api 'com.firebaseui:firebase-ui-auth:7.2.0'

    api 'com.google.code.gson:gson:2.11.0'

    def ktor = "2.3.2" // DO NOT UPDATE
    def ktor_client = "3.3.2"
    api "io.ktor:ktor-server-core:$ktor"
    api "io.ktor:ktor-server-jetty-jvm:$ktor"
    api "io.ktor:ktor-server-cio:$ktor"
    api "io.ktor:ktor-server-websockets:$ktor"
    api "io.ktor:ktor-server-cors:$ktor"
    api "io.ktor:ktor-server-content-negotiation:$ktor"

    api "io.ktor:ktor-client-core:$ktor_client"
    api "io.ktor:ktor-client-cio:$ktor_client"
    api "io.ktor:ktor-client-okhttp:$ktor_client"
    api "io.ktor:ktor-client-websockets:$ktor_client"
    api "io.ktor:ktor-client-content-negotiation:$ktor_client"
    api "io.ktor:ktor-serialization-kotlinx-protobuf:$ktor_client"
    api "io.ktor:ktor-serialization-kotlinx-json-jvm:$ktor_client"

    api 'com.google.oboe:oboe:1.9.3'

    api "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.6.0"

    compileOnly files('./libs/framework-tethering.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}